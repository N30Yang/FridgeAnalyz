<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOW ME YOUR FRIDGE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="root"></div>

    <script>

        const { useState, useRef, useEffect } = React;

        // ── STATUS LINE ──────────────────────────────────────────
        // tracks mouse position and whether a file is loaded
        function StatusLine({ hasFile }) {
            const [coords, setCoords] = useState({ x: 0, y: 0 });
            useEffect(() => {
                const h = (e) => setCoords({ x: e.clientX, y: e.clientY });
                window.addEventListener('mousemove', h);
                return () => window.removeEventListener('mousemove', h);
            }, []);
            return React.createElement('div', { className: 'status-line' },
                React.createElement('div', {
                    className: 'status-dot',
                    style: hasFile ? { background: '#00CC66' } : {}
                }),
                React.createElement('span', { className: 'status-text' },
                    hasFile ? 'SPECIMEN LOADED -- READY FOR ANALYSIS' : 'AWAITING BIOLOGICAL SPECIMEN'
                ),
                React.createElement('span', { className: 'status-coords' },
                    coords.x + 'px  ' + coords.y + 'px'
                )
            );
        }

        // ── UPLOAD SCREEN ────────────────────────────────────────
        // handles drag+drop, file picker, webcam, camera flip
        function UploadScreen({ onScan }) {
            const [dragOver, setDragOver] = useState(false);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [webcamActive, setWebcamActive] = useState(false);
            const [facingMode, setFacingMode] = useState('environment');

            const fileRef = useRef(null);
            const cameraRef = useRef(null);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            function handleFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                setPreviewUrl(URL.createObjectURL(file));
                setWebcamActive(false);
                stopStream();
            }

            function handleDrop(e) {
                e.preventDefault();
                setDragOver(false);
                handleFile(e.dataTransfer.files[0]);
            }

            function stopStream() {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(function (t) { t.stop(); });
                    streamRef.current = null;
                }
            }

            async function startCamera(mode) {
                stopStream();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
                    streamRef.current = stream;
                    setWebcamActive(true);
                    setPreviewUrl(null);
                    setTimeout(function () {
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    }, 50);
                } catch (e) {
                    alert('YOUR DEVICE REFUSES TO COOPERATE');
                }
            }

            function toggleWebcam() {
                if (webcamActive) { stopStream(); setWebcamActive(false); return; }
                startCamera(facingMode);
            }

            function switchCamera(e) {
                e.stopPropagation();
                const next = facingMode === 'user' ? 'environment' : 'user';
                setFacingMode(next);
                if (webcamActive) startCamera(next);
            }

            function captureWebcam() {
                const v = videoRef.current;
                if (!v) return;
                const canvas = document.createElement('canvas');
                canvas.width = v.videoWidth;
                canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                canvas.toBlob(function (blob) {
                    setPreviewUrl(URL.createObjectURL(blob));
                    setWebcamActive(false);
                    stopStream();
                });
            }

            useEffect(function () {
                return function () { stopStream(); };
            }, []);

            const canScan = previewUrl || webcamActive;

            return React.createElement('div', { className: 'screen-upload' },
                React.createElement('div', { className: 'scanlines' }),
                React.createElement('div', { className: 'vignette' }),
                React.createElement('div', { className: 'amb-glow' }),

                // title with glitch pseudo-elements handled in css
                React.createElement('div', { className: 'title-wrap' },
                    React.createElement('span', { className: 'title-main' }, 'SHOW ME YOUR FRIDGE')
                ),

                // drop zone
                React.createElement('div', {
                    className: 'drop-zone' + (dragOver ? ' drag-over' : ''),
                    onClick: function () { if (!webcamActive) fileRef.current.click(); },
                    onDragOver: function (e) { e.preventDefault(); setDragOver(true); },
                    onDragLeave: function () { setDragOver(false); },
                    onDrop: handleDrop,
                    style: { cursor: webcamActive ? 'default' : 'pointer' }
                },
                    React.createElement('div', { className: 'zone-bg' }),
                    React.createElement('div', { className: 'zone-scanline' }),
                    React.createElement('div', { className: 'corner-tr' }),
                    React.createElement('div', { className: 'corner-bl' }),

                    previewUrl && React.createElement('img', { src: previewUrl, className: 'preview-img', alt: '' }),
                    previewUrl && React.createElement('div', { className: 'preview-overlay' }),

                    webcamActive && React.createElement('video', {
                        ref: videoRef, className: 'webcam-video',
                        autoPlay: true, playsInline: true, muted: true
                    }),
                    webcamActive && React.createElement('button', {
                        className: 'capture-btn',
                        onClick: function (e) { e.stopPropagation(); captureWebcam(); }
                    }, 'CAPTURE'),

                    !previewUrl && !webcamActive && React.createElement(React.Fragment, null,
                        // plain text, no emoji
                        React.createElement('div', { className: 'drop-icon' }, '[ + ]'),
                        React.createElement('div', { className: 'drop-text' },
                            'DRAG YOUR EVIDENCE HERE',
                            React.createElement('br'),
                            'OR ',
                            React.createElement('em', null, 'CLICK TO BROWSE FILES')
                        )
                    )
                ),

                // hidden file inputs
                React.createElement('input', {
                    ref: fileRef, type: 'file', accept: 'image/*',
                    style: { display: 'none' },
                    onChange: function (e) { handleFile(e.target.files[0]); }
                }),
                React.createElement('input', {
                    ref: cameraRef, type: 'file', accept: 'image/*', capture: 'environment',
                    style: { display: 'none' },
                    onChange: function (e) { handleFile(e.target.files[0]); }
                }),

                React.createElement(StatusLine, { hasFile: !!previewUrl }),

                // camera buttons
                React.createElement('div', { className: 'webcam-strip' },
                    React.createElement('button', {
                        className: 'btn-webcam',
                        onClick: function (e) { e.stopPropagation(); cameraRef.current.click(); }
                    }, 'NATIVE CAMERA'),
                    React.createElement('button', {
                        className: 'btn-webcam' + (webcamActive ? ' active' : ''),
                        onClick: function (e) { e.stopPropagation(); toggleWebcam(); }
                    }, webcamActive ? 'STOP WEBCAM' : 'WEBCAM'),
                    webcamActive && React.createElement('button', {
                        className: 'btn-webcam',
                        onClick: switchCamera
                    }, 'FLIP CAM'),
                    React.createElement('span', { className: 'strip-div' }, '--'),
                    React.createElement('span', {
                        style: { fontSize: '10px', color: '#444', letterSpacing: '0.08em' }
                    }, 'DATA 100% LEAVES THIS DEVICE')
                ),

                React.createElement('div', { className: 'subtitle-pantry' }, 'SHOW ME THE PANTRY'),

                // scan button -- disabled until image is loaded
                React.createElement('div', { className: 'btn-scan-wrap' },
                    React.createElement('div', { className: 'btn-ring' }),
                    React.createElement('div', { className: 'btn-glow' }),
                    React.createElement('button', {
                        className: 'btn-scan',
                        disabled: !canScan,
                        onClick: function () { onScan(previewUrl); }
                    }, 'SCAN YOUR BIOHAZARD')
                )
            );
        }

        // ── RESULTS SCREEN ───────────────────────────────────────
        // calls /api/analyze with the image, then renders the results
        //
        // variables the ai populates in result:
        //   result.fridgeMood        -- string, e.g. "MILDLY CURSED"
        //   result.items[]           -- detected ingredients
        //     .name                  -- string
        //     .quantity              -- string (optional)
        //     .percentage            -- string e.g. "84%"
        //     .statusLabel           -- string, warning label (optional)
        //   result.recipes[]         -- real recipes
        //     .name                  -- string
        //     .ingredients[]         -- array of strings
        //     .steps[]               -- array of strings, max 3
        //     .eatRating             -- string e.g. "RELUCTANTLY" / "STRONG NO" / "ACTUALLY YES"
        //     .meta                  -- string e.g. "10 MIN  SERVES 1"
        //   result.jokeRecipes[]     -- same shape as recipes, but absurd
        function ResultsScreen({ previewUrl, onReset }) {
            const [status, setStatus] = useState('ANALYZING...');
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            useEffect(function () {
                if (!previewUrl) return;
                async function analyzeImage() {
                    try {
                        const blob = await fetch(previewUrl).then(function (r) { return r.blob(); });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = async function () {
                            const base64data = reader.result.split(',')[1];
                            try {
                                const response = await fetch('/api/analyze', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ base64Image: base64data })
                                });
                                const data = await response.json();
                                if (!response.ok) throw new Error(data.error || 'Failed to analyze');
                                setResult(data.result);
                                setStatus('ANALYSIS COMPLETE');
                            } catch (err) {
                                setError(err.message);
                                setStatus('ANALYSIS FAILED');
                            }
                        };
                    } catch (err) {
                        setError('Failed to process image');
                        setStatus('ANALYSIS FAILED');
                    }
                }
                analyzeImage();
            }, [previewUrl]);

            // loading / error state
            if (!result) {
                return React.createElement('div', { className: 'screen-results' },
                    previewUrl && React.createElement('img', { src: previewUrl, className: 'wip-preview', alt: '' }),
                    error
                        ? React.createElement('div', { className: 'error-msg' }, 'ERROR: ' + error)
                        : React.createElement(React.Fragment, null,
                            React.createElement('div', { className: 'analyzing-text' }, status),
                            React.createElement('div', { className: 'progress-bar' },
                                React.createElement('div', { className: 'progress-fill' })
                            )
                        ),
                    React.createElement('button', { className: 'btn-back', onClick: onReset }, 'BACK TO UPLOAD')
                );
            }

            // pick a color for the eat rating
            function ratingColor(rating) {
                const r = (rating || '').toUpperCase();
                if (r.includes('YES')) return '#00CC66';
                if (r.includes('NO')) return '#ff6666';
                return '#FF9800';
            }

            // shared card component for real + joke recipes
            function RecipeCard({ recipe, isJoke }) {
                return React.createElement('div', { className: 'recipe-card' + (isJoke ? ' joke' : '') },
                    React.createElement('div', { className: 'recipe-card-header' },
                        React.createElement('div', { className: 'recipe-title' }, recipe.name),
                        React.createElement('div', { className: 'recipe-rating-box' },
                            React.createElement('div', { className: 'recipe-rating-label' }, 'WOULD I EAT THIS?'),
                            React.createElement('div', {
                                className: 'recipe-rating',
                                style: { color: ratingColor(recipe.eatRating) }
                            }, recipe.eatRating || '???')
                        )
                    ),
                    React.createElement('div', { className: 'recipe-tags' },
                        (recipe.ingredients || []).map(function (ing, j) {
                            return React.createElement('div', { key: j, className: 'tag' }, ing);
                        })
                    ),
                    React.createElement('div', { className: 'recipe-steps' },
                        (recipe.steps || []).map(function (step, j) {
                            return React.createElement('div', { key: j, className: 'recipe-step' },
                                React.createElement('span', { className: 'step-num' }, (j + 1) + '.'),
                                React.createElement('span', null, step)
                            );
                        })
                    ),
                    React.createElement('div', { className: 'recipe-footer' },
                        React.createElement('span', null, recipe.meta || '??? MIN  SERVES 1'),
                        React.createElement('span', null, isJoke ? 'JOKE RECIPE -- DO NOT ATTEMPT' : 'SYSTEM v2.7')
                    )
                );
            }

            return React.createElement('div', { className: 'res-container' },

                // header bar
                React.createElement('div', { className: 'res-header' },
                    React.createElement('div', { className: 'res-title' }, 'ANALYSIS COMPLETE -- YOU HAVE BEEN JUDGED'),
                    React.createElement('div', { className: 'res-header-right' },
                        React.createElement('div', { className: 'mood-badge' },
                            React.createElement('span', { className: 'mood-label' }, 'FRIDGE MOOD: '),
                            result.fridgeMood || 'UNKNOWN'
                        ),
                        React.createElement('button', { className: 'btn-reset', onClick: onReset }, 'RESET')
                    )
                ),

                // two column body
                React.createElement('div', { className: 'res-body' },

                    // left column: image + detected items
                    React.createElement('div', { className: 'res-col-left' },
                        React.createElement('div', { className: 'res-img-wrap' },
                            React.createElement('img', { src: previewUrl, className: 'res-img', alt: 'your fridge' })
                        ),
                        React.createElement('div', { className: 'section-label' },
                            'DETECTED ITEMS (' + (result.items || []).length + ')'
                        ),
                        React.createElement('div', { className: 'item-list' },
                            (result.items || []).map(function (item, i) {
                                return React.createElement('div', { key: i, className: 'item-row' },
                                    React.createElement('div', { className: 'item-name' },
                                        item.name,
                                        item.quantity && React.createElement('span', { className: 'item-qty' },
                                            'QTY: ' + item.quantity
                                        )
                                    ),
                                    React.createElement('div', { className: 'item-right' },
                                        React.createElement('div', { className: 'item-pct' }, item.percentage),
                                        item.statusLabel && React.createElement('div', { className: 'item-warn' }, item.statusLabel)
                                    )
                                );
                            })
                        )
                    ),

                    // right column: real recipes then joke recipes
                    React.createElement('div', { className: 'res-col-right' },
                        React.createElement('div', { className: 'section-label' },
                            'GENERATED RECIPES (' + (result.recipes || []).length + ')'
                        ),
                        React.createElement('div', { className: 'recipe-list' },
                            (result.recipes || []).map(function (recipe, i) {
                                return React.createElement(RecipeCard, { key: i, recipe: recipe, isJoke: false });
                            })
                        ),

                        (result.jokeRecipes || []).length > 0 && React.createElement(React.Fragment, null,
                            React.createElement('div', {
                                className: 'section-label',
                                style: { marginTop: '28px' }
                            }, 'JOKE RECIPES (' + result.jokeRecipes.length + ') -- DO NOT ATTEMPT'),
                            React.createElement('div', { className: 'recipe-list' },
                                (result.jokeRecipes || []).map(function (recipe, i) {
                                    return React.createElement(RecipeCard, { key: i, recipe: recipe, isJoke: true });
                                })
                            )
                        )
                    )
                )
            );
        }

        // ── ROOT APP ─────────────────────────────────────────────
        function App() {
            const [screen, setScreen] = useState('upload');
            const [previewUrl, setPreviewUrl] = useState(null);
            const isMobile = window.innerWidth <= 768;

            return React.createElement('div', {
                style: {
                    width: '100vw',
                    minHeight: '100vh',
                    overflow: isMobile ? 'visible' : 'hidden',
                    position: 'relative'
                }
            },
                screen === 'upload'
                    ? React.createElement(UploadScreen, {
                        onScan: function (url) { setPreviewUrl(url); setScreen('results'); }
                    })
                    : React.createElement(ResultsScreen, {
                        previewUrl: previewUrl,
                        onReset: function () { setPreviewUrl(null); setScreen('upload'); }
                    })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>

</html>
