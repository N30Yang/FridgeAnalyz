<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOW ME YOUR FRIDGE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --primary: #E96A1A; /* orange */
            --primary-dim: #7B3F0A;
            --primary-glow: rgba(233, 106, 26, 0.12);
            --accent: #2A9D8F; /* teal */
            --accent-dim: #165F56;
            --accent-glow: rgba(42, 157, 143, 0.12);
            --white: #F0EDE8;
            --gray: #666;
            --dark: #080808;
            --surface: #0E0E0E;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            background: var(--dark)
        }

        /* desktop only: clip overflow */
        @media (min-width: 769px) {

            html,
            body,
            #root {
                overflow: auto;
                /*overflow: hidden;*/
                /* this was stopping it from scrolling for some reason - Walter*/
            }
        }

        /* mobile: allow scrolling */
        @media (max-width: 768px) {

            html,
            body,
            #root {
                overflow-x: hidden;
                overflow-y: auto;
                height: auto;
                min-height: 100%;
            }
        }

        body {
            font-family: 'Space Mono', monospace;
            color: var(--white);
            cursor: crosshair
        }

        .scanlines {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.12) 3px, rgba(0, 0, 0, 0.12) 4px)
        }

        .vignette {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 8999;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.88) 100%)
        }

        #noise-canvas {
            position: fixed;
            inset: 0;
            z-index: 8998;
            opacity: 0.055;
            pointer-events: none
        }

        .amb-glow {
            pointer-events: none;
            position: fixed;
            bottom: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(232, 0, 10, 0.18) 0%, transparent 70%);
            z-index: 8997;
            animation: ambPulse 4s ease-in-out infinite
        }

        @keyframes ambPulse {

            0%,
            100% {
                opacity: 0.6;
                transform: translateX(-50%) scaleX(1)
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) scaleX(1.08)
            }
        }

        .screen-upload {
            width: 100%;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 16px;
            position: relative;
            z-index: 10
        }

        .title-wrap {
            position: relative;
            text-align: center;
            margin-bottom: 16px
        }

        .title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(52px, 10vw, 136px);
            letter-spacing: 0.05em;
            line-height: 0.92;
            color: var(--white);
            display: block;
            position: relative;
            animation: titleBreath 6s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(232, 0, 10, 0.08);
        }

        @keyframes titleBreath {

            0%,
            100% {
                letter-spacing: 0.05em
            }

            50% {
                letter-spacing: 0.065em
            }
        }

        .title-main::before,
        .title-main::after {
            content: 'SHOW ME YOUR FRIDGE';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            font-family: 'Bebas Neue', sans-serif;
            font-size: inherit;
            letter-spacing: inherit;
            line-height: inherit;
            pointer-events: none;
        }

        .title-main::before {
            color: var(--primary);
            animation: glitchR 7s infinite;
            clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%)
        }

        .title-main::after {
            color: var(--accent);
            animation: glitchB 7s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 70%, 0 70%)
        }

        @keyframes glitchR {

            0%,
            89%,
            100% {
                transform: translate(0);
                opacity: 0
            }

            90% {
                transform: translate(-3px, 1px);
                opacity: 0.8
            }

            91% {
                transform: translate(3px, -1px);
                opacity: 0.6
            }

            92% {
                transform: translate(-1px, 0);
                opacity: 0.9
            }

            93% {
                transform: translate(0);
                opacity: 0
            }

            96% {
                transform: translate(2px, 1px);
                opacity: 0.7
            }

            97% {
                transform: translate(0);
                opacity: 0
            }
        }

        @keyframes glitchB {

            0%,
            89%,
            100% {
                transform: translate(0);
                opacity: 0
            }

            90% {
                transform: translate(3px, 0);
                opacity: 0.7
            }

            91% {
                transform: translate(-2px, 1px);
                opacity: 0.5
            }

            92.5% {
                transform: translate(0);
                opacity: 0
            }

            95% {
                transform: translate(-3px, -1px);
                opacity: 0.6
            }

            96% {
                transform: translate(0);
                opacity: 0
            }
        }

        .ticker-wrap {
            overflow: hidden;
            width: min(620px, 92vw);
            margin-bottom: 6px;
            border-top: 1px solid #1C1C1C;
            border-bottom: 1px solid #1C1C1C;
            padding: 4px 0
        }

        .ticker {
            display: inline-flex;
            gap: 0;
            white-space: nowrap;
            animation: tickerMove 22s linear infinite
        }

        @keyframes tickerMove {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(-50%)
            }
        }

        .ticker span {
            font-size: 9px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #2E2E2E;
            padding: 0 28px
        }

        .ticker span.red {
            color: var(--primary-dim)
        }

        .drop-zone {
            width: min(300px, 92vw);
            height: min(600px, 68vh);
            border: 1.5px solid #2A0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin: 12px 0 8px;
            transition: border-color 0.2s;
            background: var(--surface);
        }

        .drop-zone::before,
        .drop-zone::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--primary-dim);
            border-style: solid;
            transition: border-color 0.2s, width 0.2s, height 0.2s;
            z-index: 3;
        }

        .drop-zone::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px
        }

        .drop-zone::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0
        }

        .drop-zone .corner-tr,
        .drop-zone .corner-bl {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--primary-dim);
            border-style: solid;
            transition: border-color 0.2s, width 0.2s, height 0.2s;
            z-index: 3;
        }

        .drop-zone .corner-tr {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0
        }

        .drop-zone .corner-bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary)
        }

        .drop-zone:hover::before,
        .drop-zone.drag-over::before,
        .drop-zone:hover::after,
        .drop-zone.drag-over::after,
        .drop-zone:hover .corner-tr,
        .drop-zone.drag-over .corner-tr,
        .drop-zone:hover .corner-bl,
        .drop-zone.drag-over .corner-bl {
            border-color: var(--primary);
            width: 34px;
            height: 34px
        }

        .zone-bg {
            position: absolute;
            inset: 0;
            background: var(--primary-glow);
            opacity: 0;
            transition: opacity 0.2s
        }

        .drop-zone:hover .zone-bg,
        .drop-zone.drag-over .zone-bg {
            opacity: 1
        }

        .zone-scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(232, 0, 10, 0.45), transparent);
            animation: zoneScan 3.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 2
        }

        @keyframes zoneScan {
            0% {
                top: 0;
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: 1
            }

            100% {
                top: 100%;
                opacity: 0
            }
        }

        .drop-icon {
            font-size: 44px;
            line-height: 1;
            opacity: 0.4;
            transition: transform 0.2s, opacity 0.2s;
            position: relative;
            z-index: 1
        }

        .drop-zone:hover .drop-icon {
            transform: scale(1.12);
            opacity: 0.75
        }

        .drop-text {
            font-size: 10px;
            letter-spacing: 0.16em;
            color: var(--gray);
            text-transform: uppercase;
            text-align: center;
            line-height: 1.8;
            position: relative;
            z-index: 1
        }

        .drop-text em {
            color: var(--accent);
            font-style: normal
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            opacity: 0.55;
            filter: saturate(0.5) contrast(1.1)
        }

        .preview-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 8, 8, 0.5) 0%, transparent 40%, transparent 60%, rgba(8, 8, 8, 0.5) 100%);
            z-index: 1;
            pointer-events: none
        }

        .webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0
        }

        .capture-btn {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            border: none;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 0.1em;
            padding: 8px 28px;
            cursor: pointer;
            z-index: 10;
            clip-path: polygon(3px 0%, 100% 0%, calc(100% - 3px) 100%, 0% 100%)
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 16px;
            width: min(580px, 92vw);
            margin: 2px 0 6px
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: dotBlink 1.4s step-end infinite;
            flex-shrink: 0
        }

        @keyframes dotBlink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }

        .status-text {
            font-size: 9px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #333;
            flex: 1
        }

        .status-coords {
            font-size: 9px;
            letter-spacing: 0.1em;
            color: #222;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .webcam-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px
        }

        .btn-webcam {
            background: transparent;
            border: 1px solid var(--accent-dim);
            color: var(--accent);
            padding: 5px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s
        }

        .btn-webcam:hover {
            background: var(--accent-glow);
            border-color: var(--accent)
        }

        .btn-webcam.active {
            background: var(--accent-glow);
            border-color: var(--accent)
        }

        .strip-div {
            color: #252525;
            font-size: 10px
        }

        .subtitle-pantry {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(16px, 2.8vw, 34px);
            letter-spacing: 0.22em;
            color: #2A2A2A;
            margin-bottom: 10px;
            user-select: none;
            animation: subtitlePulse 5s ease-in-out infinite
        }

        @keyframes subtitlePulse {

            0%,
            100% {
                color: #2A2A2A
            }

            50% {
                color: #3A3A3A
            }
        }

        .btn-scan-wrap {
            position: relative;
            display: inline-block
        }

        .btn-ring {
            position: absolute;
            inset: -4px;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
            border: 1px solid #3A0002;
            pointer-events: none;
            animation: ringPulse 2s ease-in-out infinite
        }

        @keyframes ringPulse {

            0%,
            100% {
                opacity: 0.3;
                inset: -4px
            }

            50% {
                opacity: 0.8;
                inset: -8px
            }
        }

        .btn-scan {
            background: var(--primary);
            border: none;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(24px, 3.8vw, 42px);
            letter-spacing: 0.14em;
            padding: 16px 56px 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
            transition: transform 0.12s;
        }

        .btn-scan::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.18) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0s
        }

        .btn-scan:hover::before {
            transform: translateX(220%);
            transition: transform 0.5s
        }

        .btn-glow {
            position: absolute;
            inset: -8px;
            background: var(--primary);
            filter: blur(18px);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.2s;
            pointer-events: none;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%)
        }

        .btn-scan-wrap:hover .btn-glow {
            opacity: 0.3
        }

        .btn-scan:hover {
            transform: scale(1.04)
        }

        .btn-scan:active {
            transform: scale(0.97)
        }

        .btn-scan:disabled {
            background: #3A0002;
            color: #5A0004;
            cursor: not-allowed
        }

        .btn-scan:disabled~.btn-glow,
        .btn-scan:disabled+.btn-glow {
            display: none
        }

        /* RESULTS PLACEHOLDER */
        .screen-results {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 10
        }

        .wip-label {
            font-size: 9px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #282828
        }

        .wip-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(40px, 7vw, 90px);
            letter-spacing: 0.08em;
            color: #1A1A1A;
            text-align: center;
            line-height: 1
        }

        .wip-sub {
            font-size: 10px;
            letter-spacing: 0.16em;
            color: #222;
            text-transform: uppercase
        }

        .btn-back {
            background: transparent;
            border: 1px solid #2A0000;
            color: var(--primary-dim);
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 8px 20px;
            cursor: pointer;
            margin-top: 16px;
            transition: border-color 0.15s, color 0.15s, background 0.15s
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-glow)
        }

        .wip-preview {
            width: min(360px, 70vw);
            aspect-ratio: 4/3;
            object-fit: cover;
            opacity: 0.1;
            filter: saturate(0) contrast(1.3);
            border: 1px solid #181818
        }

        /* NEW RESULTS UI */
        .res-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 32px 48px;
            z-index: 10;
            position: relative;
            gap: 24px;
            box-sizing: border-box;
        }

        .res-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #222;
            padding-bottom: 16px;
            flex-shrink: 0;
        }

        .res-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            color: var(--white);
            letter-spacing: 0.05em;
            line-height: 1;
        }

        .res-header-right {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .res-mood-box {
            border: 1px solid #332200;
            padding: 6px 16px;
            color: #CC9900;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: rgba(51, 34, 0, 0.2);
        }

        .res-mood-label {
            color: #886600;
            margin-right: 8px;
        }

        .res-btn-reset {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .res-btn-reset:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-glow);
        }

        .res-body {
            display: flex;
            gap: 48px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .res-col-left {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
            overflow-y: auto;
            padding-right: 16px;
        }

        .res-col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            padding-right: 16px;
        }

        .res-img-wrap {
            width: 100%;
            height: 260px;
            border: 1px solid #222;
            position: relative;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }

        .res-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.7;
            filter: contrast(1.2) grayscale(20%);
        }

        .res-section-title {
            font-size: 10px;
            color: #555;
            letter-spacing: 0.2em;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .res-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #222;
        }

        .res-item-list {
            display: flex;
            flex-direction: column;
        }

        .res-item {
            border-bottom: 1px solid #151515;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .res-item-name {
            font-size: 13px;
            color: var(--white);
            max-width: 65%;
            line-height: 1.4;
        }

        .res-item-right {
            text-align: right;
        }

        .res-item-pct {
            font-size: 13px;
            color: var(--accent);
            font-weight: bold;
        }

        .res-item-warn {
            font-size: 9px;
            color: var(--primary);
            font-style: italic;
            margin-top: 6px;
            letter-spacing: 0.05em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .res-recipe-list {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .res-recipe {
            border-bottom: 1px solid #151515;
            padding-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .res-recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .res-recipe-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: var(--white);
            letter-spacing: 0.05em;
            line-height: 1.1;
        }

        .res-recipe-rating-box {
            text-align: right;
            flex-shrink: 0;
        }

        .res-recipe-rating-label {
            font-size: 9px;
            color: #555;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .res-recipe-rating {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .res-recipe-rating.green {
            color: #00CC66;
        }

        .res-recipe-rating.red {
            color: var(--primary);
        }

        .res-recipe-rating.orange {
            color: #FF8800;
        }

        .res-recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .res-tag {
            border: 1px solid #222;
            color: #666;
            font-size: 10px;
            padding: 5px 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .res-recipe-steps {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .res-step {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #999;
            line-height: 1.5;
        }

        .res-step-num {
            color: var(--red);
            font-weight: bold;
            flex-shrink: 0;
        }

        .res-recipe-footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #333;
            letter-spacing: 0.1em;
            margin-top: 12px;
            text-transform: uppercase;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        @media (max-width: 768px) {
            .screen-upload {
                height: auto;
                min-height: 100svh;
                justify-content: flex-start;
                padding-top: 40px;
                padding-bottom: 80px;
            }

            .res-container {
                padding: 16px 20px 80px 20px;
                gap: 16px;
                height: auto;
                min-height: 100svh;
            }

            .res-body {
                flex-direction: column;
                overflow: visible;
                gap: 32px;
            }

            .res-col-left {
                width: 100%;
                overflow: visible;
                padding-right: 0;
            }

            .res-col-right {
                width: 100%;
                overflow: visible;
                padding-right: 0;
            }

            .res-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .res-header-right {
                width: 100%;
                justify-content: space-between;
            }

            .res-title {
                font-size: 28px;
            }

            .title-main {
                font-size: 14vw;
            }

            .subtitle-pantry {
                font-size: 24px;
            }

            .btn-scan {
                font-size: 20px;
                padding: 12px 32px;
            }

            .drop-zone {
                height: 50vh;
            }

            .webcam-strip {
                flex-wrap: wrap;
                justify-content: center;
            }

            .status-line {
                flex-direction: column;
                text-align: center;
                gap: 6px;
            }
        }
    </style>
</head>

<body>
    <canvas id="noise-canvas"></canvas>
    <div id="root"></div>

    <script>
        (function () {
            const c = document.getElementById('noise-canvas');
            const ctx = c.getContext('2d');
            function resize() { c.width = window.innerWidth; c.height = window.innerHeight }
            resize(); window.addEventListener('resize', resize);
            function frame() {
                const id = ctx.createImageData(c.width, c.height);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255 }
                ctx.putImageData(id, 0, 0); requestAnimationFrame(frame);
            }
            frame();
        })();

        const { useState, useRef, useEffect } = React;

        const TICKER = [
            { t: 'BIOHAZARD DETECTION SYSTEM v2.7', r: false }, { t: '⚠ WARNING: DO NOT OPEN MYSTERY CONTAINERS', r: true },
            { t: 'THREAT ASSESSMENT ENGINE ONLINE', r: false }, { t: '⚠ EXPIRED DAIRY DETECTED IN SECTOR 4', r: true },
            { t: 'FRIDGE CRIME CLASSIFIER READY', r: false }, { t: '⚠ UNIDENTIFIED SLUDGE IN PROGRESS', r: true },
            { t: 'ALL SCANS ARE NON-REVERSIBLE', r: false }, { t: '⚠ YOU HAVE BEEN WARNED', r: true },
        ];

        function Ticker() {
            const items = [...TICKER, ...TICKER];
            return React.createElement('div', { className: 'ticker-wrap' },
                React.createElement('div', { className: 'ticker' },
                    items.map((it, i) => React.createElement('span', { key: i, className: it.r ? 'red' : '' }, it.t))
                )
            );
        }

        function StatusLine({ hasFile }) {
            const [coords, setCoords] = useState({ x: 0, y: 0 });
            useEffect(() => {
                const h = (e) => setCoords({ x: e.clientX, y: e.clientY });
                window.addEventListener('mousemove', h); return () => window.removeEventListener('mousemove', h);
            }, []);
            return React.createElement('div', { className: 'status-line' },
                React.createElement('div', { className: 'status-dot', style: hasFile ? { background: '#00CC66' } : {} }),
                React.createElement('span', { className: 'status-text' },
                    hasFile ? 'SPECIMEN LOADED — READY FOR ANALYSIS' : 'AWAITING BIOLOGICAL SPECIMEN'),
                React.createElement('span', { className: 'status-coords' }, `${coords.x}px · ${coords.y}px`)
            );
        }

        function UploadScreen({ onScan }) {
            const [dragOver, setDragOver] = useState(false);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [webcamActive, setWebcamActive] = useState(false);
            const [facingMode, setFacingMode] = useState('environment');
            const fileRef = useRef(null);
            const cameraRef = useRef(null);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            const handleFile = (file) => {
                if (!file || !file.type.startsWith('image/')) return;
                setPreviewUrl(URL.createObjectURL(file));
                setWebcamActive(false);
                streamRef.current?.getTracks().forEach(t => t.stop()); streamRef.current = null;
            };
            const handleDrop = (e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]) };

            const startCamera = async (mode) => {
                streamRef.current?.getTracks().forEach(t => t.stop());
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
                    streamRef.current = stream; setWebcamActive(true); setPreviewUrl(null);
                    setTimeout(() => { if (videoRef.current) videoRef.current.srcObject = stream; }, 50);
                } catch { alert('YOUR DEVICE REFUSES TO COOPERATE'); }
            };

            const toggleWebcam = () => {
                if (webcamActive) { streamRef.current?.getTracks().forEach(t => t.stop()); streamRef.current = null; setWebcamActive(false); return; }
                startCamera(facingMode);
            };

            const switchCamera = (e) => {
                e.stopPropagation();
                const newMode = facingMode === 'user' ? 'environment' : 'user';
                setFacingMode(newMode);
                if (webcamActive) startCamera(newMode);
            };
            const captureWebcam = () => {
                const v = videoRef.current; if (!v) return;
                const canvas = document.createElement('canvas');
                canvas.width = v.videoWidth; canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                canvas.toBlob(blob => {
                    setPreviewUrl(URL.createObjectURL(blob));
                    setWebcamActive(false);
                    streamRef.current?.getTracks().forEach(t => t.stop()); streamRef.current = null;
                });
            };
            useEffect(() => () => { streamRef.current?.getTracks().forEach(t => t.stop()); }, []);
            const canScan = previewUrl || webcamActive;

            return React.createElement('div', { className: 'screen-upload' },
                React.createElement('div', { className: 'scanlines' }),
                React.createElement('div', { className: 'vignette' }),
                React.createElement('div', { className: 'amb-glow' }),

                React.createElement('div', { className: 'title-wrap' },
                    React.createElement('span', { className: 'title-main' }, 'SHOW ME YOUR FRIDGE')
                ),

                React.createElement(Ticker),

                React.createElement('div', {
                    className: `drop-zone${dragOver ? ' drag-over' : ''}`,
                    onClick: () => !webcamActive && fileRef.current.click(),
                    onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
                    onDragLeave: () => setDragOver(false),
                    onDrop: handleDrop,
                    style: { cursor: webcamActive ? 'default' : 'pointer' }
                },
                    React.createElement('div', { className: 'zone-bg' }),
                    React.createElement('div', { className: 'zone-scanline' }),
                    React.createElement('div', { className: 'corner-tr' }),
                    React.createElement('div', { className: 'corner-bl' }),
                    previewUrl && React.createElement('img', { src: previewUrl, className: 'preview-img', alt: '' }),
                    previewUrl && React.createElement('div', { className: 'preview-overlay' }),
                    webcamActive && React.createElement('video', { ref: videoRef, className: 'webcam-video', autoPlay: true, playsInline: true, muted: true }),
                    webcamActive && React.createElement('button', { className: 'capture-btn', onClick: (e) => { e.stopPropagation(); captureWebcam(); } }, 'CAPTURE'),
                    !previewUrl && !webcamActive && React.createElement(React.Fragment, null,
                        React.createElement('div', { className: 'drop-icon' }, '⚠'),
                        React.createElement('div', { className: 'drop-text' },
                            'DRAG YOUR EVIDENCE HERE', React.createElement('br'),
                            'or ', React.createElement('em', null, 'click to browse files')
                        )
                    )
                ),

                React.createElement('input', { ref: fileRef, type: 'file', accept: 'image/*', style: { display: 'none' }, onChange: (e) => handleFile(e.target.files[0]) }),
                React.createElement('input', { ref: cameraRef, type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' }, onChange: (e) => handleFile(e.target.files[0]) }),

                React.createElement(StatusLine, { hasFile: !!previewUrl }),

                React.createElement('div', { className: 'webcam-strip' },
                    React.createElement('button', {
                        className: 'btn-webcam',
                        onClick: (e) => { e.stopPropagation(); cameraRef.current.click(); }
                    }, '📸 NATIVE CAMERA'),
                    React.createElement('button', {
                        className: `btn-webcam${webcamActive ? ' active' : ''}`,
                        onClick: (e) => { e.stopPropagation(); toggleWebcam(); }
                    }, webcamActive ? '◼ STOP WEBCAM' : '◉ WEB CAM'),
                    webcamActive && React.createElement('button', {
                        className: 'btn-webcam',
                        onClick: switchCamera
                    }, '🔄 SWITCH CAM'),
                    React.createElement('span', { className: 'strip-div' }, '——'),
                    React.createElement('span', { style: { fontSize: '9px', color: '#252525', letterSpacing: '0.12em' } }, 'NO DATA LEAVES THIS DEVICE')
                ),

                React.createElement('div', { className: 'subtitle-pantry' }, 'SHOW ME THE PANTRY'),

                React.createElement('div', { className: 'btn-scan-wrap' },
                    React.createElement('div', { className: 'btn-ring' }),
                    React.createElement('div', { className: 'btn-glow' }),
                    React.createElement('button', {
                        className: 'btn-scan',
                        disabled: !canScan,
                        onClick: () => onScan(previewUrl)
                    }, 'SCAN YOUR BIOHAZARD')
                )
            );
        }

        function ResultsScreen({ previewUrl, onReset }) {
            const [status, setStatus] = useState('ANALYZING...');
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                if (!previewUrl) return;

                const analyzeImage = async () => {
                    try {
                        const blob = await fetch(previewUrl).then(r => r.blob());
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = async () => {
                            const base64data = reader.result.split(',')[1];
                            try {
                                const response = await fetch('/api/analyze', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ base64Image: base64data })
                                });
                                const data = await response.json();
                                if (!response.ok) throw new Error(data.error || 'Failed to analyze');
                                setResult(data.result);
                                setStatus('ANALYSIS COMPLETE');
                            } catch (err) {
                                setError(err.message);
                                setStatus('ANALYSIS FAILED');
                            }
                        };
                    } catch (err) {
                        setError('Failed to process image');
                        setStatus('ANALYSIS FAILED');
                    }
                };

                analyzeImage();
            }, [previewUrl]);

            if (error || !result) {
                return React.createElement('div', { className: 'screen-results' },
                    React.createElement('div', { className: 'scanlines' }),
                    React.createElement('div', { className: 'vignette' }),
                    React.createElement('div', { className: 'amb-glow' }),
                    previewUrl && React.createElement('img', { src: previewUrl, className: 'wip-preview', alt: '' }),
                    error ? React.createElement('div', { style: { color: 'var(--red)', fontFamily: 'Space Mono', textAlign: 'center', marginTop: '20px', zIndex: 11, position: 'relative' } }, `ERROR: ${error}`)
                        : React.createElement('div', { className: 'wip-title', style: { zIndex: 11, position: 'relative', marginTop: '20px' } }, status),
                    React.createElement('button', { className: 'btn-back', onClick: onReset, style: { zIndex: 11, position: 'relative', marginTop: '20px' } }, '← BACK TO UPLOAD')
                );
            }

            const getRatingColor = (rating) => {
                const r = (rating || '').toUpperCase();
                if (r.includes('YES')) return 'green';
                if (r.includes('NO')) return 'red';
                return 'orange';
            };

            return React.createElement('div', { className: 'res-container' },
                React.createElement('div', { className: 'scanlines' }),
                React.createElement('div', { className: 'vignette' }),

                React.createElement('div', { className: 'res-header' },
                    React.createElement('div', { className: 'res-title' }, 'ANALYSIS COMPLETE — YOU HAVE BEEN JUDGED'),
                    React.createElement('div', { className: 'res-header-right' },
                        React.createElement('div', { className: 'res-mood-box' },
                            React.createElement('span', { className: 'res-mood-label' }, 'FRIDGE MOOD:'),
                            result.fridgeMood || 'UNKNOWN'
                        ),
                        React.createElement('button', { className: 'res-btn-reset', onClick: onReset }, '⟳ RESET')
                    )
                ),

                React.createElement('div', { className: 'res-body' },
                    React.createElement('div', { className: 'res-col-left' },
                        React.createElement('div', { className: 'res-img-wrap' },
                            React.createElement('img', { src: previewUrl, className: 'res-img', alt: 'Fridge' })
                        ),
                        React.createElement('div', { className: 'res-section-title' }, `DETECTED ITEMS (${(result.items || []).length})`),
                        React.createElement('div', { className: 'res-item-list' },
                            (result.items || []).map((item, i) =>
                                React.createElement('div', { key: i, className: 'res-item' },
                                    React.createElement('div', { className: 'res-item-name' },
                                        item.name,
                                        item.quantity && React.createElement('span', { style: { color: 'var(--gray)', fontSize: '10px', display: 'block', marginTop: '4px', letterSpacing: '0.05em' } }, `QTY: ${item.quantity}`)
                                    ),
                                    React.createElement('div', { className: 'res-item-right' },
                                        React.createElement('div', { className: 'res-item-pct' }, item.percentage),
                                        item.statusLabel && React.createElement('div', { className: 'res-item-warn' }, item.statusLabel)
                                    )
                                )
                            )
                        )
                    ),

                    React.createElement('div', { className: 'res-col-right' },
                        React.createElement('div', { className: 'res-section-title' }, `GENERATED RECIPES (${(result.recipes || []).length})`),
                        React.createElement('div', { className: 'res-recipe-list' },
                            (result.recipes || []).map((recipe, i) =>
                                React.createElement('div', { key: i, className: 'res-recipe' },
                                    React.createElement('div', { className: 'res-recipe-header' },
                                        React.createElement('div', { className: 'res-recipe-title' }, recipe.name),
                                        React.createElement('div', { className: 'res-recipe-rating-box' },
                                            React.createElement('div', { className: 'res-recipe-rating-label' }, 'WOULD I EAT THIS?'),
                                            React.createElement('div', { className: `res-recipe-rating ${getRatingColor(recipe.eatRating)}` }, recipe.eatRating)
                                        )
                                    ),
                                    React.createElement('div', { className: 'res-recipe-tags' },
                                        (recipe.ingredients || []).map((ing, j) =>
                                            React.createElement('div', { key: j, className: 'res-tag' }, ing)
                                        )
                                    ),
                                    React.createElement('div', { className: 'res-recipe-steps' },
                                        (recipe.steps || []).map((step, j) =>
                                            React.createElement('div', { key: j, className: 'res-step' },
                                                React.createElement('div', { className: 'res-step-num' }, `${j + 1}.`),
                                                React.createElement('div', null, step)
                                            )
                                        )
                                    ),
                                    React.createElement('div', { className: 'res-recipe-footer' },
                                        React.createElement('span', null, recipe.meta || '??? MIN ・ SERVES 1'),
                                        React.createElement('span', null, 'SYSTEM v2.7')
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function App() {
            const [screen, setScreen] = useState('upload');
            const [previewUrl, setPreviewUrl] = useState(null);
            const isMobile = window.innerWidth <= 768;
            return React.createElement('div', { style: { width: '100vw', minHeight: '100vh', overflow: isMobile ? 'visible' : 'hidden', position: 'relative' } },
                screen === 'upload'
                    ? React.createElement(UploadScreen, { onScan: (url) => { setPreviewUrl(url); setScreen('results'); } })
                    : React.createElement(ResultsScreen, { previewUrl, onReset: () => { setPreviewUrl(null); setScreen('upload'); } })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>

</html>
